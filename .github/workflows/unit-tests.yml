name: Unit Tests

# Only run the workflow for pull requests
on: pull_request

permissions:
  contents: read

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.ref}}
  cancel-in-progress: true

jobs:
  lint-js:
    name: Frontend linting and type checking
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production bundles
        run: |
          npm run build
          git diff --exit-code -- build

      - name: Lint JS files
        run: npm run lint:js

      - name: Type check frontend files
        run: npm run typecheck

  unit-js:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build the plugin
        run: |
          npm ci

      - name: Running the tests
        run: npm run test:js

  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions:
          - 8.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          tools: composer
          php-version: ${{ matrix.php-versions }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress

      - name: PHPCS
        run: composer run-script phpcs

  unit-php:
    # Alias 'master' to 'latest'
    name: WP ${{ matrix.wp }} and PHP ${{ matrix.php }}${{ matrix.gutenberg && ' with Gutenberg' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wp: ['master']
        gutenberg: [false]
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - php: '8.2'
            wp: '6.8'
            gutenberg: false
          # Exercise Gutenberg's preset metadata on both supported PHP boundaries.
          - php: '8.2'
            wp: 'master'
            gutenberg: true
          - php: '8.5'
            wp: 'master'
            gutenberg: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress

      - name: Setup wp-env test environment
        run: npx wp-env start --config=${{ matrix.gutenberg && '.wp-env.gutenberg.json' || '.wp-env.test.json' }}
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wp }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      - name: PHPUnit
        run: composer test${{ matrix.gutenberg && '-gutenberg' || '' }} --no-interaction

      - name: PHPUnit multisite
        run: composer run-script test-multisite${{ matrix.gutenberg && '-gutenberg' || '' }} --no-interaction
